name: Auto-refresh content

on:
  schedule:
    - cron: "17 5 * * *"     # daily 05:17 UTC
    - cron: "17 17 * * *"    # and 17:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/auto-refresh.yml"

permissions:
  contents: write

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest legal news and videos
        run: python scripts/update_feeds.py

      - name: Rebuild pages, sitemap and search index
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "smart-legal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-refresh: legal news, videos and sitemap ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
